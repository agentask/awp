[project]
name = "awp-sdk"
version = "0.1.0"
description = "AWP reference Python SDK: a thin, standalone client for sending envelopes and calling sync tools"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=49.0.0",
    "httpx>=0.28.1",
    "python-ulid>=4.0.1",
    "rfc8785>=0.1.4",
]

[project.urls]
Repository = "https://github.com/agentask/awp"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["awp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
