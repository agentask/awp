[project]
name = "awp-concierge-agent"
version = "0.1.0"
description = "concierge.local — the Python corner of the Go/Python/Rust AWP triangle demo (see README.md)"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "awp-sdk",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.51.0",
]

[project.urls]
Repository = "https://github.com/agentask/awp"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv.sources]
awp-sdk = { path = "../../sdk/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["concierge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
