name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # semver pre-release identifiers (e.g. v0.1.0-m1, v0.1.0-rc1) publish
          # as GitHub pre-releases; a clean vX.Y.Z publishes as a full release.
          prerelease_flag=""
          if [[ "$TAG" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            $prerelease_flag
